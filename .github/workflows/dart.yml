name: HarmonixTune CI - Validation Continue

on:
  push:
    branches: [ "develop", "master" ]
  pull_request:
    branches: [ "develop", "master" ]

jobs:
  quality_gate:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. FIX : Utilisation de l'action officielle pour installer Java
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Installation et mise en cache du SDK Flutter
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.7'
          cache: true

      # 4. Récupération des dépendances
      - name: Install dependencies
        run: flutter pub get

      # 4bis. Génération de code (adaptateurs Hive via build_runner)
      - name: Run build_runner (code generation)
        run: dart run build_runner build --delete-conflicting-outputs

      # 5. Vérification du formatage (Optionnel : si tu as des conflits, tu peux utiliser "flutter format .")
      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed .

      # 6. Analyse statique stricte (Quality Gate)
      - name: Analyze project source
        run: flutter analyze --fatal-warnings --fatal-infos

      # 7. Exécution des tests unitaires
      - name: Run unit tests
        run: flutter test --coverage

      # 8. Publication de la couverture de tests sur Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  deploy_beta:
    name: Distribution beta (Firebase App Distribution)
    runs-on: ubuntu-latest
    needs: quality_gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner (code generation)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK (flavor staging)
        run: flutter build apk --release --flavor staging -t lib/main_staging.dart

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: "1:111449505542:android:b12a6491e5ca16abada887"
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-staging-release.apk
          releaseNotes: "Build automatique develop — ${{ github.sha }}"
